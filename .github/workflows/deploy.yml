name: Deploy site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out data
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth 1 origin data
            git worktree add data FETCH_HEAD
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        working-directory: site
        env:
          DATA_DIR: ../data
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
        run: npm run build
      - name: Size check
        # Apparent size is what goes into the Pages artifact. Plain du also counts a 4 KB
        # disk block for each of the ~30,000 folders, which overstates it by a third.
        run: |
          du -sh --apparent-size site/dist
          size=$(du -sm --apparent-size site/dist | cut -f1)
          if [ "$size" -gt 800 ]; then echo "::error::Site is ${size} MB, close to the 1 GB GitHub Pages limit"; exit 1; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
