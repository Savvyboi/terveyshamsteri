name: Weekly scrape

on:
  schedule:
    - cron: "0 23 * * 0"   # Sunday 23:00 UTC = Monday night in Finland
  workflow_dispatch:
    inputs:
      region:
        description: "Only this region id (empty = all enabled regions)"
        required: false
      max_minutes:
        description: "Time budget per region in minutes (a long backfill continues next run)"
        default: "300"
      refresh:
        description: "Refetch every meeting, not only new and recent ones"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.r.outputs.regions }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - id: r
        working-directory: scraper
        run: |
          if [ -n "${{ inputs.region }}" ]; then
            echo "regions=[\"${{ inputs.region }}\"]" >> "$GITHUB_OUTPUT"
          else
            echo "regions=$(python -m terveyshamsteri regions)" >> "$GITHUB_OUTPUT"
          fi

  scrape:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false        # one broken source must not stop the others
      max-parallel: 4
      matrix:
        region: ${{ fromJson(needs.plan.outputs.regions) }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out previous data
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth 1 origin data
            git worktree add data FETCH_HEAD
          else
            mkdir data
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - name: Scrape ${{ matrix.region }}
        working-directory: scraper
        run: >
          python -m terveyshamsteri scrape ${{ matrix.region }} --data ../data
          --max-minutes ${{ inputs.max_minutes || '300' }}
          ${{ inputs.refresh && '--refresh' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: region-${{ matrix.region }}
          path: data/${{ matrix.region }}
          if-no-files-found: ignore
          retention-days: 7

  # Regional election results from Statistics Finland. Final once published, so counties
  # already in the data branch are kept and only missing ones are fetched.
  elections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out previous data
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth 1 origin data
            git worktree add data FETCH_HEAD
          else
            mkdir data
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - name: Fetch election results
        working-directory: scraper
        run: python -m terveyshamsteri elections --data ../data ${{ inputs.refresh && '--refresh' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: region-elections
          path: data/elections
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: [scrape, elections]
    if: always() && needs.scrape.result != 'cancelled' && needs.elections.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - name: Check out previous data
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth 1 origin data
            git worktree add data FETCH_HEAD
          else
            mkdir data
          fi
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: region-*
      - name: Merge regions
        run: |
          for dir in artifacts/region-*; do
            [ -d "$dir" ] || continue
            region="${dir#artifacts/region-}"
            rm -rf "data/$region"
            cp -r "$dir" "data/$region"
          done
      - name: Re-extract votes
        working-directory: scraper
        run: python -m terveyshamsteri reextract --data ../data
      - name: Write index
        working-directory: scraper
        run: python -m terveyshamsteri index --data ../data
      - name: Push data branch
        # The data branch is always a single commit. When a region removes personal data
        # from its minutes, the old text must not survive in our git history either.
        run: |
          cd data
          rm -rf .git
          git init -q -b data
          git config user.name "terveyshamsteri-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '# Terveyshamsteri data\n\nGenerated by the weekly scrape on %s. Do not edit by hand.\n' "$(date -u +%F)" > README.md
          git add -A
          git commit -q -m "Data $(date -u +%F)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

  deploy:
    needs: publish
    if: always() && needs.publish.result == 'success'
    uses: ./.github/workflows/deploy.yml
