name: Explore (temporary)
on:
  push:
    branches: [claude/project-thread-75llmi]
    paths: [".github/explore/**", ".github/workflows/explore.yml", "scraper/terveyshamsteri/adapters/mfiles.py"]
jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - working-directory: scraper
        run: python -m terveyshamsteri scrape etela-karjala --data ../probe --max-meetings 4 2>&1 | grep -v "DEBUG"
      - run: |
          python - <<'PY'
          import json, pathlib
          for p in sorted(pathlib.Path("probe").rglob("meetings/**/*.json")):
              m = json.loads(p.read_text())
              print(f"== {p}: {m['body_name']} {m['date']} stage={m['stage']} time={m['time']} place={m['place']} pdf={m['pdf_url']}")
              print("   participants", len(m["participants"]), m["participants"][:6])
              for it in m["items"]:
                  print(f"   § {it['number']} {it['title'][:70]!r} dno={it['diary_number']} att={len(it['attachments'])} votes={[v['counts'] for v in it['votes']]} red={it['redacted']}")
                  print(f"     heads={[s['heading'] for s in it['sections']]}")
                  print(f"     prep={it['preparer']!r} pres={it['presenter']!r}")
                  print(f"     proposal={(it['proposal'] or '')[:160]!r}")
                  print(f"     decision={(it['decision'] or '')[:160]!r}")
          print(json.dumps(json.loads(pathlib.Path("probe/etela-karjala/bodies.json").read_text()), ensure_ascii=False))
          PY
