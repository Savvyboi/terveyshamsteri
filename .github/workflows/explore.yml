name: Explore (temporary)
on:
  push:
    branches: [claude/project-thread-75llmi]
    paths: [".github/explore/**", ".github/workflows/explore.yml"]
jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: |
          for u in $(cat .github/explore/urls.txt); do timeout 120 python -u .github/explore/explore.py "$u" || echo "TIMEOUT/FAIL $u"; done
