name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt pytest
      - run: python -m pytest -q
        working-directory: scraper

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - name: Build with sample data
        working-directory: site
        run: |
          npm run sample
          DATA_DIR=./sample-data npm run build

  # Scrapes a few real meetings from each pilot region so parser changes are checked
  # against the live sources. Informational: a source outage should not block a PR.
  probe:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        region: [keski-suomi, pirkanmaa, kanta-hame, varsinais-suomi]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - name: Scrape 3 meetings
        working-directory: scraper
        run: python -m terveyshamsteri scrape ${{ matrix.region }} --data ../probe --max-meetings 3
      - name: Summarise
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          for p in sorted(pathlib.Path("probe").rglob("meetings/**/*.json"))[:3]:
              m = json.loads(p.read_text())
              print(f"== {p}: {m['body_name']} {m['date']} stage={m['stage']} time={m['time']} place={m['place']}")
              print(f"   pdf={m['pdf_url']} items={len(m['items'])} participants={len(m['participants'])}")
              for pp in m["participants"][:4]:
                  print("   participant:", pp)
              for it in m["items"][:3]:
                  print(f"   § {it['number']} {it['title']!r} dno={it['diary_number']} att={len(it['attachments'])} votes={len(it['votes'])}")
                  print(f"     sections={[s['heading'] for s in it['sections']]}")
                  print(f"     preparer={it['preparer']!r} presenter={it['presenter']!r}")
                  print(f"     proposal={(it['proposal'] or '')[:200]!r}")
                  print(f"     decision={(it['decision'] or '')[:200]!r}")
              longest = max(m["items"], key=lambda it: sum(len(s["text"]) for s in it["sections"]), default=None)
              if longest:
                  print(f"   longest item § {longest['number']} {longest['title']!r}:")
                  for s in longest["sections"]:
                      print(f"     [{s['heading']}] {s['text'][:700]!r}")
          PY
      - name: Verdict
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          r = "${{ matrix.region }}"
          st = json.loads((pathlib.Path("probe") / r / "status.json").read_text()) if (pathlib.Path("probe") / r / "status.json").exists() else {}
          bodies = json.loads((pathlib.Path("probe") / r / "bodies.json").read_text()) if (pathlib.Path("probe") / r / "bodies.json").exists() else []
          ms = [json.loads(p.read_text()) for p in pathlib.Path("probe").rglob("meetings/**/*.json")]
          items = [it for m in ms for it in m["items"]]
          c = lambda k: sum(1 for it in items if it.get(k))
          print(f"::notice title=VERDICT {r}::result={st.get('result')} errors={st.get('errors')} bodies={len(bodies)} meetings={len(ms)} "
                f"stages={[m['stage'] for m in ms]} items={len(items)} proposal={c('proposal')} decision={c('decision')} "
                f"diary={c('diary_number')} preparer={c('preparer')} att={c('attachments')} "
                f"participants={[len(m['participants']) for m in ms]} lang={[m['language'] for m in ms]}")
          if items:
              it = max(items, key=lambda it: sum(len(s["text"]) for s in it["sections"]))
              print(f"::notice title=SAMPLE {r}::{it['title'][:60]!r} heads={[s['heading'] for s in it['sections']][:10]} "
                    f"proposal={(it['proposal'] or '')[:150]!r} decision={(it['decision'] or '')[:150]!r} "
                    f"preparer={it['preparer']!r} presenter={it['presenter']!r} dno={it['diary_number']!r}")
              for m in ms[:1]:
                  print(f"::notice title=MEETING {r}::{m['body_name']} {m['date']} {m['stage']} time={m['time']} place={m['place']} "
                        f"participants={m['participants'][:3]}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.region }}
          path: probe
          if-no-files-found: ignore

  # Fetches one county's election table so changes to the Statistics Finland importer are
  # checked against the live API. Informational, like the probes above.
  elections-probe:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - name: Fetch Kainuu and Pohjanmaa
        working-directory: scraper
        run: python -m terveyshamsteri elections --data ../probe --region kainuu --region pohjanmaa
      - name: Verdict
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          for p in sorted(pathlib.Path("probe/elections/2025").glob("*.json")):
              d = json.loads(p.read_text())
              print(f"::notice title=ELECTIONS {p.stem}::seats={d['seats']} votes={d['votes_total']} "
                    f"parties={[(x['party'], x['seats']) for x in d['parties']]} people={len(d['people'])} first={d['people'][:2]}")
          PY

  finance-probe:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - name: Fetch Kainuu finances
        working-directory: scraper
        run: python -m terveyshamsteri finances --data ../probe --region kainuu
      - name: Verdict
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          d = json.loads(pathlib.Path("probe/finances/kainuu.json").read_text())
          docs = {x["key"]: x["columns"] for x in d["documents"]}
          last = max(k for k in docs if k.startswith("HHKNR/") and k.endswith("C12"))
          a = docs[last][""]
          pop = json.loads(pathlib.Path("probe/finances/population.json").read_text())["regions"]["kainuu"]
          print(f"::notice title=FINANCES kainuu::reports={len(docs)} {last}: expenses={a.get('expenses')} surplus={a.get('surplus')} "
                f"cumulative={a.get('cumulative_surplus')} loans={a.get('loans')} population={pop}")
          PY

  # Temporary: where do Etelä-Pohjanmaa and Etelä-Karjala publish minutes?
  site-probe:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        start: ["https://www.hyvaep.fi", "https://ekhva.fi"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - run: python scraper/probes/site_probe.py "${{ matrix.start }}" 3
